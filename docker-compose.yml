# Ambiente de desenvolvimento — `docker compose up -d`
#   mysql, redis            → infraestrutura
#   setup                   → instala dependências, compila pacotes e aplica migrations (executa e sai)
#   backend/worker/scheduler → apps/api em modo dev (hot reload por polling), após o setup
#   tools (perfil)          → comandos avulsos: `docker compose run --rm tools <comando>`
# O serviço frontend é adicionado no PASSO 5.
name: aom

# Código montado do host + node_modules em volumes nomeados (Linux), nunca no bind mount:
# evita binários incompatíveis com o SO do host e a lentidão de I/O no Windows/macOS.
x-workspace-volumes: &workspace-volumes
  - .:/workspace
  - pnpm_store:/pnpm/store
  - node_modules:/workspace/node_modules
  - node_modules_config:/workspace/packages/config/node_modules
  - node_modules_types:/workspace/packages/types/node_modules
  - node_modules_shared:/workspace/packages/shared/node_modules
  - node_modules_database:/workspace/packages/database/node_modules
  - node_modules_api:/workspace/apps/api/node_modules

# Variáveis da aplicação, repassadas explicitamente do .env (vazias = padrão da aplicação).
x-app-env: &app-env
  NODE_ENV: development
  TZ: UTC
  # Versão do Prisma é fixada (ADR-012); o aviso de atualização só polui os logs.
  PRISMA_HIDE_UPDATE_MESSAGE: 'true'
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-}
  DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: ${DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL:-false}
  REDIS_URL: ${REDIS_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TRUST_PROXY: ${TRUST_PROXY:-}
  HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-}
  HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT:-}
  RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
  QUEUE_DEFAULT_ATTEMPTS: ${QUEUE_DEFAULT_ATTEMPTS:-}
  QUEUE_BACKOFF_DELAY_MS: ${QUEUE_BACKOFF_DELAY_MS:-}
  QUEUE_REMOVE_ON_COMPLETE: ${QUEUE_REMOVE_ON_COMPLETE:-}
  QUEUE_REMOVE_ON_FAIL: ${QUEUE_REMOVE_ON_FAIL:-}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-}
  HEARTBEAT_TTL_MS: ${HEARTBEAT_TTL_MS:-}
  HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-}
  FEATURE_FLAGS_CACHE_TTL_SECONDS: ${FEATURE_FLAGS_CACHE_TTL_SECONDS:-}

x-dev-image: &dev-image
  build:
    context: .
    target: dev
  working_dir: /workspace
  volumes: *workspace-volumes

x-api-dev: &api-dev
  <<: *dev-image
  environment:
    <<: *app-env
  restart: unless-stopped
  depends_on:
    setup:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # Cria os bancos <db>_test e <db>_shadow na primeira inicialização do volume.
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 força TCP: só fica saudável após o fim da inicialização
      # (o servidor temporário do entrypoint roda sem rede).
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # AOF para durabilidade das filas; `noeviction` é obrigatório para o BullMQ.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # Executa uma vez por `up`: dependências, build dos pacotes do workspace e migrations.
  # Serializa a instalação (evita que backend/worker/scheduler instalem em paralelo).
  setup:
    <<: *dev-image
    environment:
      <<: *app-env
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && pnpm --filter "@aom/api^..." build && pnpm db:migrate:deploy
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  backend:
    <<: *api-dev
    command: pnpm --filter @aom/api dev
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *api-dev
    command: pnpm --filter @aom/api dev:worker
    healthcheck:
      test: ['CMD-SHELL', 'pnpm --silent --filter @aom/api healthcheck:dev worker']
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *api-dev
    command: pnpm --filter @aom/api dev:scheduler
    healthcheck:
      test: ['CMD-SHELL', 'pnpm --silent --filter @aom/api healthcheck:dev scheduler']
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Ferramentas do monorepo (pnpm, lint, testes, migrations) sem Node no host.
  tools:
    <<: *dev-image
    profiles: [tools]
    environment:
      <<: *app-env
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      TEST_REDIS_URL: ${TEST_REDIS_URL:-}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
      SEED_SUPER_ADMIN_NAME: ${SEED_SUPER_ADMIN_NAME:-}
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  redis_data:
  pnpm_store:
  node_modules:
  node_modules_config:
  node_modules_types:
  node_modules_shared:
  node_modules_database:
  node_modules_api:
